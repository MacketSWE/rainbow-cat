<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regnbågskatten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe6ff;font-family:'Baloo 2',system-ui,sans-serif}
  canvas{display:block}
  #hud{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;
    background:rgba(255,255,255,.88);padding:6px 22px;border-radius:16px;font-size:30px;font-weight:800;color:#6a3fa0;
    box-shadow:0 6px 20px rgba(0,0,0,.12);user-select:none;white-space:nowrap}
  #dots{display:flex;gap:6px}
  #dots span{width:24px;height:24px;border-radius:50%;background:#e4e4e4;transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
  #dots.balloons span.got{background:linear-gradient(135deg,#ff7eb6 50%,#5ab0ff 50%);transform:scale(1.25)}
  #dots.lamps span.got{background:radial-gradient(circle,#ffe27a 0 45%,#e0301e 46%);transform:scale(1.25)}
  #dots.balls span.got{background:radial-gradient(circle at 35% 35%,#fff 0 18%,#ff5a5a 19% 60%,#3ba7ff 61%);transform:scale(1.25)}
  #dots span.got{background:conic-gradient(#ff3b3b,#ff9a2e,#ffe53b,#4cd964,#3ba7ff,#5a5cff,#b05cff,#ff3b3b);transform:scale(1.25)}
  #help{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.85);padding:6px 18px;
    border-radius:14px;font-size:18px;color:#444;font-weight:600;transition:opacity 1.5s;user-select:none;text-align:center;max-width:calc(100% - 32px)}
  #toast{position:fixed;top:84px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);padding:6px 22px;border-radius:16px;
    font-size:28px;font-weight:800;color:#d4462e;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
  #win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(255,255,255,.3)}
  #win h1{font-size:clamp(36px,7vw,72px);margin:0 16px;color:#fff;text-align:center;line-height:1.1;
    text-shadow:0 4px 0 #b06ad8,0 10px 24px rgba(0,0,0,.25)}
  #win button{margin-top:24px;font:inherit;font-size:30px;font-weight:800;padding:8px 34px;border:none;border-radius:18px;
    background:#ff7eb6;color:#fff;cursor:pointer;box-shadow:0 6px 0 #d45490}
  #win button:active{transform:translateY(4px);box-shadow:0 2px 0 #d45490}
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="hud"><span id="label">Bana 1: Regnbågar</span><div id="dots"></div></div>
<div id="help">Pilarna styr katten. Klicka i gräset så springer den dit. Mellanslag hoppar och jamar.</div>
<div id="toast"></div>
<div id="win"><h1 id="winText">Hurra!</h1><button id="again">Spela igen</button></div>

<script type="module">
import * as THREE from 'three';

const COUNT = 7;          // antal regnbågar att hitta
const FIELD = 40;         // hur långt katten får gå
const RB = [0xff3b3b, 0xff9a2e, 0xffe53b, 0x4cd964, 0x3ba7ff, 0x5a5cff, 0xb05cff];
const rand = (a, b) => a + Math.random() * (b - a);

// ---------- renderare, scen, kamera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const FOG = new THREE.Color(0xc4e8ff);
scene.fog = new THREE.Fog(FOG, 35, 110);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);

// himmel
const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color(0x3d9bff) }, bottom: { value: FOG } },
  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `uniform vec3 top, bottom; varying vec3 vP;
    void main(){ float h = clamp(vP.y * 1.5, 0., 1.); gl_FragColor = vec4(mix(bottom, top, pow(h, .6)), 1.);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
    }`
}));
sky.renderOrder = -1;
scene.add(sky);

// ljus
const hemi = new THREE.HemisphereLight(0xd6eeff, 0x4a7a2a, 1.3);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d6, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 90 });
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

// ---------- mark och gräs ----------
const ground = new THREE.Mesh(new THREE.CircleGeometry(200, 64), new THREE.MeshStandardMaterial({ color: 0x3f8a26, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const bladeGeo = new THREE.PlaneGeometry(0.09, 0.7, 1, 4);
bladeGeo.translate(0, 0.35, 0);
{ const p = bladeGeo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setX(i, p.getX(i) * (1 - (p.getY(i) / 0.7) * 0.85)); }

const grassU = {
  uTime: { value: 0 }, uCat: { value: new THREE.Vector3() }, uLight: { value: 1 },
  uHoles: { value: Array.from({ length: 8 }, () => new THREE.Vector3()) },
  uFogColor: { value: FOG }, uFogNear: { value: 35 }, uFogFar: { value: 110 }
};
const grassMat = new THREE.ShaderMaterial({
  uniforms: grassU, side: THREE.DoubleSide,
  vertexShader: `
    uniform float uTime; uniform vec3 uCat; uniform vec3 uHoles[8];
    attribute float aShade;
    varying float vH; varying float vShade; varying float vDepth;
    void main(){
      vH = uv.y; vShade = aShade;
      vec4 w = modelMatrix * instanceMatrix * vec4(position, 1.);
      float k = vH * vH;
      float s = sin(uTime*1.7 + w.x*.3 + w.z*.2)*.22 + sin(uTime*3.1 + w.x*1.3 + w.z*.7)*.06;
      w.x += s*k; w.z += s*.4*k;
      vec2 d = w.xz - uCat.xz; float dl = length(d) + 1e-4;
      float p = smoothstep(1.4, .2, dl) * k;
      w.xz += d/dl * p * .7; w.y -= p * .25;
      vec3 b0 = (modelMatrix * instanceMatrix * vec4(0., 0., 0., 1.)).xyz;
      for (int i = 0; i < 8; i++) { vec3 h = uHoles[i]; if (h.z > 0. && distance(b0.xz, h.xy) < h.z + .2) w.y = -10.; }
      vec4 mv = viewMatrix * w; vDepth = -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform vec3 uFogColor; uniform float uFogNear, uFogFar, uLight;
    varying float vH; varying float vShade; varying float vDepth;
    void main(){
      vec3 base = vec3(.05, .20, .02);
      vec3 tip = mix(vec3(.30, .65, .08), vec3(.62, .80, .14), vShade);
      vec3 c = mix(base, tip, vH) * uLight;
      gl_FragColor = vec4(mix(c, uFogColor, smoothstep(uFogNear, uFogFar, vDepth)), 1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
{
  const N = 70000;
  const grass = new THREE.InstancedMesh(bladeGeo, grassMat, N);
  const shade = new Float32Array(N);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i < N; i++) {
    const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * 62;
    p.set(Math.cos(a) * r, 0, Math.sin(a) * r);
    q.setFromAxisAngle(up, Math.random() * Math.PI);
    const h = rand(0.7, 1.5); s.set(rand(0.8, 1.3), h, 1);
    grass.setMatrixAt(i, m.compose(p, q, s));
    shade[i] = Math.random();
  }
  grass.geometry.setAttribute('aShade', new THREE.InstancedBufferAttribute(shade, 1));
  grass.frustumCulled = false;
  scene.add(grass);
}

// blommor
let flowerMesh; const flowerPos = [];
{
  const cols = [0xffffff, 0xffe14d, 0xff8fc7, 0xc58cff, 0xff6b6b].map(c => new THREE.Color(c));
  const n = 800;
  const fl = new THREE.InstancedMesh(new THREE.SphereGeometry(0.09, 8, 6), new THREE.MeshStandardMaterial({ roughness: .6 }), n);
  const m = new THREE.Matrix4();
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * 55;
    const fp = new THREE.Vector3(Math.cos(a) * r, rand(0.45, 0.65), Math.sin(a) * r); flowerPos.push(fp);
    m.makeTranslation(fp.x, fp.y, fp.z);
    fl.setMatrixAt(i, m);
    fl.setColorAt(i, cols[(Math.random() * cols.length) | 0]);
  }
  scene.add(fl); flowerMesh = fl;
}

// träd runt ängen och buskar att gömma sig bakom
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x7a4b2a, roughness: 1 });
const leafMats = [0x2f7d32, 0x3b9440, 0x4aa84a].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: .9 }));
function tree(x, z, s) {
  const g = new THREE.Group();
  const t = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.35, 2.2, 8), trunkMat);
  t.position.y = 1.1; t.castShadow = true; g.add(t);
  for (let i = 0; i < 4; i++) {
    const b = new THREE.Mesh(new THREE.IcosahedronGeometry(rand(1, 1.5), 1), leafMats[i % 3]);
    b.position.set(rand(-.7, .7), rand(2.6, 3.6), rand(-.7, .7));
    b.castShadow = true; g.add(b);
  }
  g.position.set(x, 0, z); g.scale.setScalar(s); scene.add(g);
}
for (let i = 0; i < 60; i++) { const a = Math.random() * Math.PI * 2, r = rand(46, 80); tree(Math.cos(a) * r, Math.sin(a) * r, rand(1, 1.8)); }
const bushPos = [];
for (let i = 0; i < 16; i++) {
  const a = Math.random() * Math.PI * 2, r = rand(8, 38);
  const g = new THREE.Group();
  for (let j = 0; j < 3; j++) {
    const b = new THREE.Mesh(new THREE.IcosahedronGeometry(rand(.6, .9), 1), leafMats[j]);
    b.position.set(rand(-.6, .6), .5, rand(-.6, .6)); b.castShadow = true; g.add(b);
  }
  g.position.set(Math.cos(a) * r, 0, Math.sin(a) * r); scene.add(g); bushPos.push(g.position);
}

// moln
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, emissive: 0xffffff, emissiveIntensity: .25 });
const clouds = [];
for (let i = 0; i < 14; i++) {
  const g = new THREE.Group();
  for (let j = 0; j < 5; j++) {
    const b = new THREE.Mesh(new THREE.SphereGeometry(rand(2, 3.5), 12, 10), cloudMat);
    b.position.set(j * 2.2 - 4.4, rand(-.5, .8), rand(-1, 1)); g.add(b);
  }
  g.position.set(rand(-120, 120), rand(28, 45), rand(-120, 120));
  scene.add(g); clouds.push(g);
}

// ---------- regnbågskatten ----------
const catU = { uMode: { value: 0 }, uTime: { value: 0 }, uCat: { value: new THREE.Vector3() }, uDir: { value: new THREE.Vector3(0, 0, 1) } };
function rainbowFur() {
  const m = new THREE.MeshStandardMaterial({ roughness: .55 });
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, catU);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWorldP;')
      .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvWorldP = (modelMatrix * vec4(transformed, 1.)).xyz;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vWorldP; uniform float uMode; uniform float uTime; uniform vec3 uCat; uniform vec3 uDir;
        vec3 hash3(vec3 p){ p = vec3(dot(p, vec3(127.1, 311.7, 74.7)), dot(p, vec3(269.5, 183.3, 246.1)), dot(p, vec3(113.5, 271.9, 124.6))); return fract(sin(p) * 43758.5453) * .8 + .1; }
        vec3 hue(float h){ return clamp(abs(mod(h*6. + vec3(0.,4.,2.), 6.) - 3.) - 1., 0., 1.); }`)
      .replace('vec4 diffuseColor = vec4( diffuse, opacity );', `
        vec3 rel = vWorldP - uCat;
        float along = dot(rel, uDir);                // från svansen till nosen
        float h = fract(-along * .45 + rel.y * .25 - uTime * .35);
        vec3 rc = hue(h);
        float st = smoothstep(.4, .6, .5 + .5 * sin((-along * 1.4 + rel.y * .6 - uTime * 1.2) * 3.14159));
        vec3 pb = mix(vec3(1., .5, .78), vec3(.36, .66, 1.), st);
        rc = mix(rc, pb, clamp(uMode, 0., 1.));
        if (uMode > 1.5 && uMode < 2.5) {
          vec3 side = normalize(cross(vec3(0., 1., 0.), uDir));
          vec3 lp = vec3(dot(rel, side), rel.y, along) * 4.;
          vec3 cell = floor(lp); float md = 9.;
          for (int x = -1; x <= 1; x++) for (int y = -1; y <= 1; y++) for (int z = -1; z <= 1; z++) {
            vec3 cc = cell + vec3(x, y, z); md = min(md, length(lp - cc - hash3(cc)));
          }
          float ring = smoothstep(.2, .26, md) * (1. - smoothstep(.36, .42, md));
          float mid = 1. - smoothstep(.18, .22, md);
          vec3 gold = vec3(1., .74, .2) * (.9 + .2 * sin(uTime * 3. + along * 6. + rel.y * 4.));
          rc = mix(gold, vec3(1., .5, .12), mid);
          rc = mix(rc, vec3(.82, .06, .05), ring);
        }
        if (uMode > 2.5) {
          vec3 side = normalize(cross(vec3(0., 1., 0.), uDir));
          vec3 lp = vec3(dot(rel, side), rel.y, along) * 1.8;
          vec3 cell = floor(lp); float md = 9.;
          for (int x = -1; x <= 1; x++) for (int y = -1; y <= 1; y++) for (int z = -1; z <= 1; z++) {
            vec3 cc = cell + vec3(x, y, z); md = min(md, length(lp - cc - hash3(cc)));
          }
          rc = mix(vec3(1., .76, .08), vec3(.55, .27, .07), 1. - smoothstep(.3, .36, md));
        }
        rc = mix(rc, vec3(1.), .12);
        vec4 diffuseColor = vec4(rc * rc, opacity);`);
  };
  return m;
}

function makeCat(kind = 'cat') {
  const leo = kind === 'leo', dog = kind === 'dog';
  const cat = new THREE.Group();
  const fur = rainbowFur();
  const cream = new THREE.MeshStandardMaterial({ color: 0xfff6ea, roughness: .9 });
  const pink = new THREE.MeshStandardMaterial({ color: 0xff8fa8, roughness: .6 });
  const black = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: .25 });
  const brown = new THREE.MeshStandardMaterial({ color: 0x7a4420, roughness: .8 });
  const white = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const add = (geo, mat, parent, x, y, z, sx = 1, sy = 1, sz = 1) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.scale.set(sx, sy, sz);
    m.castShadow = true; parent.add(m); return m;
  };
  const body = new THREE.Group(); cat.add(body);
  if (dog) add(new THREE.SphereGeometry(.5, 28, 18), fur, body, 0, .85, 0, .75, .66, 1.4);
  else if (leo) add(new THREE.SphereGeometry(.5, 28, 18), fur, body, 0, .85, 0, .72, .6, 1.6);
  else add(new THREE.SphereGeometry(.5, 28, 18), fur, body, 0, .8, 0, .78, .68, 1.25);
  add(new THREE.SphereGeometry(.25, 16, 12), cream, body, 0, .78, leo ? .6 : .42, .9, .9, .6);

  const head = new THREE.Group(); head.position.set(0, dog ? 1.38 : 1.3, leo ? .92 : dog ? .8 : .62); if (leo) head.scale.setScalar(.9); body.add(head);
  add(new THREE.SphereGeometry(.4, 28, 18), fur, head, 0, 0, 0, 1.05, .95, .95);
  if (dog) {
    add(new THREE.SphereGeometry(.2, 16, 12), cream, head, 0, -.12, .36, 1.05, .8, 1.5);
    add(new THREE.SphereGeometry(.08, 12, 10), black, head, 0, -.04, .66, 1.2, .9, 1);
    add(new THREE.SphereGeometry(.09, 12, 8), pink, head, 0, -.27, .5, .8, .25, 1.2);
  } else {
    add(new THREE.SphereGeometry(.17, 16, 12), cream, head, 0, -.12, .3, 1.3, .8, .8);
    add(new THREE.SphereGeometry(.05, 10, 8), pink, head, 0, -.04, .42);
  }
  for (const sx of [-1, 1]) {
    add(new THREE.SphereGeometry(.075, 12, 10), black, head, sx * .15, .07, .33);
    add(new THREE.SphereGeometry(.025, 8, 6), white, head, sx * .15 + .025, .1, .4);
    if (dog) {
      const ear = add(new THREE.SphereGeometry(.17, 14, 10), brown, head, sx * .37, -.04, -.02, .45, 1.35, .9);
      ear.rotation.z = sx * .3;
    } else if (leo) {
      add(new THREE.SphereGeometry(.13, 14, 10), fur, head, sx * .25, .3, -.02, 1, 1, .45);
      add(new THREE.SphereGeometry(.07, 10, 8), pink, head, sx * .25, .3, .03, 1, 1, .3);
    } else {
      const ear = add(new THREE.ConeGeometry(.15, .32, 4), fur, head, sx * .21, .36, 0);
      ear.rotation.set(0, Math.PI / 4, -sx * .35);
      const inner = add(new THREE.ConeGeometry(.08, .2, 4), pink, head, sx * .2, .33, .06);
      inner.rotation.set(0, Math.PI / 4, -sx * .35);
    }
  }
  const wg = new THREE.BufferGeometry();
  const wp = [];
  for (const sx of [-1, 1]) for (const dy of [-.03, .03]) wp.push(sx * .12, -.1, .4, sx * .5, -.1 + dy * 3, .36);
  wg.setAttribute('position', new THREE.Float32BufferAttribute(wp, 3));
  if (!dog) head.add(new THREE.LineSegments(wg, new THREE.LineBasicMaterial({ color: 0xffffff })));

  const legs = [];
  for (const [x, z] of dog ? [[.22, .58], [-.22, .58], [.22, -.58], [-.22, -.58]] : leo ? [[.2, .68], [-.2, .68], [.2, -.68], [-.2, -.68]] : [[.22, .45], [-.22, .45], [.22, -.45], [-.22, -.45]]) {
    const pivot = new THREE.Group(); pivot.position.set(x, .62, z); cat.add(pivot);
    add(new THREE.CylinderGeometry(.1, .09, .5, 12), fur, pivot, 0, -.25, 0);
    add(new THREE.SphereGeometry(.11, 12, 10), cream, pivot, 0, -.52, .03, 1, .7, 1.2);
    legs.push(pivot);
  }
  const tail = [];
  const tl = leo ? 18 : dog ? 7 : 12;
  for (let i = 0; i < tl; i++) tail.push(add(new THREE.SphereGeometry(leo ? .09 - i * .0015 : .1 - i * .003, 12, 10), fur, body, 0, 0, 0));
  if (leo) cat.scale.setScalar(1.15);
  scene.add(cat);
  return { cat, body, head, legs, tail, leo, dog, kind };
}
let kitty = makeCat('cat');
function setCharacter(kind) {
  if (kitty.kind === kind) return;
  const p = kitty.cat.position.clone();
  scene.remove(kitty.cat);
  kitty = makeCat(kind);
  kitty.cat.position.copy(p);
}

// ---------- regnbågar ----------
const rainbowGeos = RB.map((c, i) => new THREE.TorusGeometry(2.2 - i * .17, .09, 10, 64, Math.PI));
const rainbowMats = RB.map(c => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: .6, roughness: .5 }));
let rainbows = [];
function makeRainbow(x, z) {
  const g = new THREE.Group();
  rainbowGeos.forEach((geo, i) => { const m = new THREE.Mesh(geo, rainbowMats[i]); m.castShadow = true; g.add(m); });
  for (const sx of [-1, 1]) for (let j = 0; j < 4; j++) {
    const b = new THREE.Mesh(new THREE.SphereGeometry(rand(.35, .5), 12, 10), cloudMat);
    b.position.set(sx * 1.7 + rand(-.45, .45), rand(0, .35), rand(-.3, .3)); g.add(b);
  }
  g.position.set(x, 0, z);
  g.userData = { baseRot: Math.random() * Math.PI, phase: Math.random() * 10, got: false, gotAt: 0 };
  g.rotation.y = g.userData.baseRot;
  scene.add(g);
  return g;
}
const BALLOON = [0xff7eb6, 0x5ab0ff, 0xffd93b, 0xb05cff, 0x4cd964, 0xff5a5a, 0xff9a2e];
const balloonGeo = new THREE.SphereGeometry(.55, 24, 18);
const knotGeo = new THREE.ConeGeometry(.08, .14, 8);
function makeBalloon(x, z, i) {
  const g = new THREE.Group();
  const col = BALLOON[i % BALLOON.length];
  const mat = new THREE.MeshStandardMaterial({ color: col, roughness: .25, metalness: .05, emissive: col, emissiveIntensity: .15 });
  const b = new THREE.Mesh(balloonGeo, mat); b.scale.set(1, 1.2, 1); b.castShadow = true; g.add(b);
  const shine = new THREE.Mesh(new THREE.SphereGeometry(.1, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .7 }));
  shine.position.set(.2, .3, .42); shine.scale.set(1, 1.6, .5); g.add(shine);
  const k = new THREE.Mesh(knotGeo, mat); k.position.y = -.68; k.rotation.x = Math.PI; g.add(k);
  const sg = new THREE.BufferGeometry().setFromPoints(Array.from({ length: 12 }, (_, j) => new THREE.Vector3(Math.sin(j * .9) * .06, -.72 - j * .14, 0)));
  g.add(new THREE.Line(sg, new THREE.LineBasicMaterial({ color: 0xffffff })));
  const baseY = rand(1.9, 2.6);
  g.position.set(x, baseY, z);
  g.userData = { kind: 'balloon', color: col, baseY, baseRot: 0, phase: Math.random() * 10, got: false, gotAt: 0 };
  scene.add(g);
  return g;
}
function glowTexture() {

        if (u.kind === 'lamp') { carried.push(rb); burst(rb.position.clone().setY(.8), 140, [0xffd23b, 0xe0301e, 0xffffff]); chime([659.25, 783.99, 987.77, 1318.5]); }
        else if (u.kind === 'ball') { rb.visible = false; burst(rb.position.clone(), 120, [u.color, 0xffffff]); bark(); setTimeout(() => chime(), 150); }
        else if (isB) { rb.visible = false; burst(rb.position.clone(), 140, [u.color, 0xffffff, u.color]); pop(); }
        else { burst(rb.position.clone().setY(2)); chime(); }
        if (found === COUNT) setTimeout(() => {
          document.getElementById('winText').innerHTML = LEVELS[level].win;
          document.getElementById('again').textContent = LEVELS[level].button;
          win.style.display = 'flex';
          chime([523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5, 1568], .12);
          for (let i = 0; i < 6; i++) setTimeout(() => burst(cp.clone().add(new THREE.Vector3(rand(-4, 4), rand(2, 5), rand(-4, 4)))), i * 200);
        }, 900);
      }
    } else if (!u.kind) {
      const k = Math.min((t - u.gotAt) / 1, 1);
      rb.scale.setScalar(1 - k * k);
      rb.position.y += dt * 4;
      rb.rotation.y += dt * 8;
      rb.visible = k < 1;
    }
  }

  // lamporna leoparden har plockat upp följer efter i ett tåg
  carried.forEach((l, i) => {
    const tgt = i === 0 ? cp.clone().addScaledVector(dir, -2.2).setY(1.1) : carried[i - 1].position.clone();
    const d = l.position.distanceTo(tgt);
    if (i === 0) l.position.lerp(tgt, 1 - Math.exp(-dt * 6));
    else if (d > .95) l.position.lerp(tgt, (d - .95) / d * Math.min(1, dt * 10));
    l.position.y += (1.1 + Math.sin(t * 2.2 + i) * .15 - l.position.y) * Math.min(1, dt * 4);
    l.rotation.z = Math.sin(t * 3 + i) * .15;
    l.scale.setScalar(.85);
  });

  // glitter
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i]; b.life += dt;
    const p = b.pts.geometry.attributes.position;
    b.V.forEach((v, j) => { v.y -= 9 * dt; p.setXYZ(j, p.getX(j) + v.x * dt, p.getY(j) + v.y * dt, p.getZ(j) + v.z * dt); });
    p.needsUpdate = true;
    b.pts.material.opacity = 1 - b.life / 1.6;
    if (b.life > 1.6) { scene.remove(b.pts); b.pts.geometry.dispose(); bursts.splice(i, 1); }
  }

  marker.material.opacity *= Math.pow(.2, dt);
  clouds.forEach((c, i) => { c.position.x += dt * (.6 + i % 3 * .2); if (c.position.x > 140) c.position.x = -140; });

  // kamera följer katten
  camGoal.set(cp.x - dir.x * 8, 4.8 + cp.y * .3, cp.z - dir.z * 8);
  camera.position.lerp(camGoal, 1 - Math.exp(-dt * 2.5));
  look.set(cp.x, 1.2 + cp.y * .5, cp.z);
  camera.lookAt(look);
  sky.position.copy(camera.position);
  sun.position.set(cp.x + 15, 25, cp.z + 10); sun.target.position.copy(cp);
  grassU.uTime.value = t; grassU.uCat.value.copy(cp);

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
